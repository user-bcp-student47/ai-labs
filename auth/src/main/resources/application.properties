quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${AUTH_CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
auth.token.secret=${AUTH_TOKEN_SECRET:}
auth.db.url=${AUTH_DB_URL:jdbc:sqlite:./data/workshop.db}
%test.auth.db.url=${AUTH_DB_URL:jdbc:sqlite:./target/workshop-auth-test.db}
%test.auth.token.secret=test-only-signing-key-with-at-least-32-bytes
